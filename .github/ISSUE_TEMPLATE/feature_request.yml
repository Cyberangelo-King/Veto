name: Feature request
description: Propose a bounded improvement to Veto
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Which user and task does this help?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Intended outcome
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable, testable conditions.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks and trade-offs
    validations:
      required: false
